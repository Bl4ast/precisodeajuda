<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>precisodesuaajudaporfavormeabra</title>
    <style>
        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 40px;
            background-color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #888;
        }

        .cipher-text {
            font-size: 1.5rem;
            color: #ff4444;
            margin: 20px 0;
            user-select: none;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: #00ff00;
            font-family: inherit;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            padding: 5px;
            width: 300px;
        }

        button {
            margin-top: 20px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            color: #00ff00;
            border-color: #00ff00;
        }

        .hint {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>O NOME DO SEGREDO É A CHAVE</h1>
        
        <!-- Texto cifrado usando Vigenère com a chave 'bl4ast' -->
        <!-- Frase original: ELE ESTA CORRENDO VEJA O QUE EU VI -->
        <div class="cipher-text">
            <p>wz6ubH.'6a)wf6809xwp&a9-p@+ey!fo)</p>
        </div>

        <input type="text" id="answer" placeholder="Digite a resposta aqui..." autocomplete="off">
        <br>
        <button onclick="verify()">VERIFICAR</button>

        
    </div>

    <script>
        function verify() {
            // Pegamos o valor, transformamos em minúsculo e removemos espaços sobrando
            const val = document.getElementById('answer').value.toLowerCase().trim();
            
            // A comparação deve ser feita com a frase em MINÚSCULO aqui no código
            if (val == "VOCÊ DEVE REVELAR O SEGREDO") {
                alert("ACESSO CONCEDIDO.");
                // Substitua pelo seu link real do YouTube quando estiver pronto
                window.location.href = "https://youtube.com/shorts/DNINMWe0IFQ?feature=share";
            } else {
                alert("CHAVE INCORRETA. TENTE NOVAMENTE.");
                document.getElementById('answer').value = "";
            }
        }
    </script>
</body>
</html>
